[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tensite-bms-ble"
version = "0.1.0"
description = "Read Tensite / UhomeEnergy BMS battery clusters over BLE"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["bms", "ble", "bluetooth", "tensite", "uhomeenergy", "lifepo4"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
]

# Kept deliberately minimal, and the floors deliberately loose: this library is
# installed *into* Home Assistant, which pins both of these itself. A tight
# floor here would fight that pin and could force an unwanted upgrade of HA's
# Bluetooth stack.
#
# Verified against bleak 2.1.1 / bleak-retry-connector 4.4.3 (Home Assistant
# 2026.2.3) and bleak 3.0.2 / bleak-retry-connector 4.6.3 (standalone, tested
# on real hardware).
dependencies = [
    "bleak>=0.22.0",
    "bleak-retry-connector>=3.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
tensite-bms-ble = "tensite_bms_ble.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tensite_bms_ble"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
